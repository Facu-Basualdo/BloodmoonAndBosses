plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	// src/client: lo que sólo existe en el cliente (cielo rojo en luna de sangre). Así src/main no puede usar por error
	// una clase de net.minecraft.client, que en un servidor dedicado no está
	splitEnvironmentSourceSets()

	mods {
		"bloodmoonandbosses" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Segundo cliente para probar con 2 jugadores a la vez: gradlew runClient2
		client2 {
			client()
			configName = "Minecraft Client 2"
			programArgs "--username", "Jugador2"
			runDir "run-client2"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jade es opcional: sólo para compilar el plugin (compat/jade). Para probarlo en runClient, poné su jar en run/mods
	compileOnly "maven.modrinth:jade:${project.jade_version}"

	// Mod Menu también es opcional: sólo para compilar IntegracionConModMenu, que Mod Menu carga si está instalado
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// MIT pide que el aviso de copyright viaje con cada copia, y el jar es la copia que circula.
jar {
	from("LICENSE")
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Pruebas automáticas dentro del juego (src/gametest): gradlew runGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "bloodmoonandbosses-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// El servidor de prueba guarda su config en build/run/gameTest y no la pisa: si quedara la de una corrida vieja,
// los tests correrían con los valores por defecto de antes y no con los de Configuracion.POR_DEFECTO
// (lo mismo con el cliente de prueba, al que la prueba de la pantalla de configuración le cambia valores)
def configDePrueba = layout.buildDirectory.dir("run/gameTest/config")
def configDelClienteDePrueba = layout.buildDirectory.dir("run/clientGameTest/config")
tasks.matching { it.name == "runGameTest" }.configureEach {
	doFirst {
		configDePrueba.get().asFile.deleteDir()
	}
}
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	doFirst {
		configDelClienteDePrueba.get().asFile.deleteDir()
	}
}
